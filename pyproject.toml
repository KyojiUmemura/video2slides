[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2slides"
version = "0.1.2"
description = "Extract slides from recorded video and generate a PDF"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "tqdm>=4.65",
    "img2pdf>=0.5",
    "PyMuPDF>=1.23.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
video2slides = "video2slides.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
no_site_packages = true
warn_redundant_casts = true
warn_unused_configs = true
